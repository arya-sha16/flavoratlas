version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: flavoratlas-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flavoratlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: flavoratlas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: flavoratlas-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/flavoratlas?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=flavoratlas-very-long-secret-key-for-jwt-access-token-generation-2026
      - JWT_REFRESH_SECRET=flavoratlas-very-long-secret-key-for-jwt-refresh-token-rotation-2026
      - CLIENT_URL=http://localhost
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flavoratlas-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
